name: RoomScan
options:
  bundleIdPrefix: com.anujmish1229
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  RoomScanKit:
    path: RoomScanKit
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  RoomScan:
    type: application
    platform: iOS
    sources: [RoomScanApp]
    dependencies:
      - package: RoomScanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anujmish1229.roomscan
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: RoomScanApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Add personal catalogue if present
        basedOnDependencyAnalysis: false
        script: |
          # catalog-local/ is gitignored, so this only does anything on the owner's Mac.
          for file in ikea-global.json ikea-starter.json; do
            source="$SRCROOT/../catalog-local/$file"
            target="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/$file"
            if [ -f "$source" ]; then cp "$source" "$target"; else rm -f "$target"; fi
          done
  RoomScanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RoomScanUITests]
    dependencies:
      - target: RoomScan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.anujmish1229.roomscan.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  RoomScan:
    build:
      targets:
        RoomScan: all
    test:
      targets:
        - RoomScanUITests
