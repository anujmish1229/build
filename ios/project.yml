name: RoomScan
options:
  bundleIdPrefix: com.anujmish1229
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  RoomScanKit:
    path: RoomScanKit
settings:
  base:
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  RoomScan:
    type: application
    platform: iOS
    sources: [RoomScanApp]
    dependencies:
      - package: RoomScanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anujmish1229.roomscan
        INFOPLIST_FILE: RoomScanApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
